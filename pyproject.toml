[project]
name = "mnemospark"
version = "0.1.0"
description = "Mnemospark project (Python examples and tooling)"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
# BCM Pricing Calculator examples (e.g. examples/s3_storage_cost_estimate.py)
bcm-pricing = ["boto3>=1.34.0"]
# Object storage script (examples/object_storage_upload.py): S3 + client-held encryption
object-storage = ["boto3>=1.34.0", "cryptography>=42.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mnemospark"]
