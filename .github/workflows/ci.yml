name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify version files match package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")
          PLUGIN_VERSION=$(node -p "require('./openclaw.plugin.json').version")
          if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ] || [ "$PKG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Version drift detected:"
            echo "  package.json:                  $PKG_VERSION"
            echo "  .release-please-manifest.json: $MANIFEST_VERSION"
            echo "  openclaw.plugin.json:          $PLUGIN_VERSION"
            echo ""
            echo "Keep package.json, .release-please-manifest.json, and openclaw.plugin.json in sync."
            exit 1
          fi
          echo "Version files match package.json: $PKG_VERSION ✓"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint src/

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install check (plugin load)
        run: npm run test:install-check
