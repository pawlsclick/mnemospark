name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Lint
        run: npx eslint src/

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install check (plugin load)
        run: npm run test:install-check

  - name: Verify manifest version matches package.json
    run: |
      PKG_VERSION=$(node -p "require('./package.json').version")
      MANIFEST_VERSION=$(node -p "require('./.release-please-manifest.json')['.']")
      if [ "$PKG_VERSION" != "$MANIFEST_VERSION" ]; then
        echo "Version drift detected:"
        echo "  package.json:                  $PKG_VERSION"
        echo "  .release-please-manifest.json: $MANIFEST_VERSION"
        echo ""
        echo "Keep these in sync. Either merge via release-please (preferred) or"
        echo "manually update .release-please-manifest.json when bumping package.json."
        exit 1
      fi
      echo "Manifest version matches package.json: $PKG_VERSION ✓"
